name: Create Nibi release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
  allocation-regression:
    uses: ./.github/workflows/allocation-regression.yml
  build-artifacts:
    needs: [test, allocation-regression]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
      sha: ${{ github.sha }}
  create-release:
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate changelog
        run: python3 scripts/extract_changelog.py "${{ github.ref_name }}" > generated-changelog.md
      - uses: actions/download-artifact@v4
      - uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          bodyFile: generated-changelog.md
          commit: ${{ github.sha }}
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          removeArtifacts: true
          artifacts: archive-x64/*.tar.gz
