name: Allocation regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explicit-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Check explicit resource allocation routing
        run: cargo test -p hyperqueue --locked explicit_worker_resources
      - name: Check allocation time tiers and existing worker reuse
        run: cargo test -p hyperqueue -p tako --locked allocation_time_tier
      - name: Check CPU allocation sizes, thresholds and shared worker caps
        run: cargo test -p hyperqueue --locked cpu_allocation
      - name: Check journal and server directory defaults
        run: cargo test -p hyperqueue --locked journal_directory
      - name: Build HQ for journal CLI regression
        run: cargo build -p hyperqueue --bin hq --locked
      - name: Check journal environment, overrides, directory creation and restoration
        run: python3 scripts/test_journal_directory.py target/debug/hq
